[project]
name = "dealdesk"
version = "0.1.0"
description = "A model-agnostic CRM assistant agent built with LangChain, LangGraph and LangSmith."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adarsh Nandina" }]
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.0,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langsmith>=0.14,<1",
    "langchain-mcp-adapters>=0.3,<1",
    "mcp>=1.20,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "typer>=0.12,<1",
]

[project.scripts]
dealdesk = "dealdesk.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"src/dealdesk/db/seed.py" = ["E501"]  # tabular demo data
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dealdesk"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: tests that need a running Postgres (DEALDESK_TEST_DATABASE_URL)",
]
